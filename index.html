<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVocab AI - Học Từ Vựng Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-indigo-600/30">🧠</div>
            <h1 class="text-2xl font-bold text-white">NeuroVocab AI</h1>
            <p class="text-xs text-slate-400">Hệ thống học từ vựng nội bộ • Đăng nhập admin</p>
        </div>

        <div id="login-box" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tài khoản</label>
                <input type="text" id="username" value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Mật khẩu</label>
                <input type="password" id="password" placeholder="123" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <p id="error-msg" class="text-xs text-rose-400 hidden"></p>
            <button onclick="handleLogin()" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition shadow-lg shadow-indigo-600/30 cursor-pointer">Đăng Nhập Ngay</button>
        </div>

        <div id="dashboard-box" class="hidden space-y-4 text-center">
            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-1">
                <h2 class="text-lg font-bold text-emerald-400">Đăng nhập thành công!</h2>
                <p class="text-xs text-slate-300">Chào mừng bạn đến với kho học tập chuyên nghiệp.</p>
            </div>
            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-left space-y-2">
                <span class="text-xs font-bold text-indigo-400 uppercase">Bài học: Giao Tiếp Công Sở</span>
                <p class="text-sm font-semibold text-white">1. negotiate (v): đàm phán</p>
                <p class="text-sm font-semibold text-white">2. collaborate (v): hợp tác</p>
                <p class="text-sm font-semibold text-white">3. deadline (n): hạn chót</p>
            </div>
            <button onclick="alert('Đang mở phiên học từ vựng...')" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold transition cursor-pointer">Bắt Đầu Học Phiên Mới</button>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const err = document.getElementById('error-msg');

            if (user === 'admin' && pass === '123') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('dashboard-box').classList.remove('hidden');
            } else {
                err.textContent = 'Sai tài khoản hoặc mật khẩu! (Dùng: admin / 123)';
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
